[package]
name = "omtalk-store"
version = "0.1.9"
edition.workspace = true
license.workspace = true

[dependencies]
omemo = { version = "0.1.9", path = "../omemo" }
omtalk-omemo = { version = "0.1.9", path = "../omemo-client" }
omtalk-xmpp = { version = "0.1.9", path = "../xmpp" }
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
thiserror = "2.0.21"

[dev-dependencies]
omemo-xml = { path = "../omemo-xml" }
omtalk-testkit = { path = "../testkit" }
omtalk-xmpp = { path = "../xmpp" }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time"] }
