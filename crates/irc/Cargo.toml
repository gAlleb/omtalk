[package]
name = "omtalk-irc"
version = "0.1.11"
edition.workspace = true
license.workspace = true

[dependencies]
omtalk-core = { version = "0.1.11", path = "../core" }
irc-proto = "1.1.0"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
omtalk-media = { path = "../media" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
