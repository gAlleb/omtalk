[package]
name = "omtalk"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
omemo = { version = "0.1.0", path = "../omemo" }
omtalk-omemo = { version = "0.1.0", path = "../omemo-client" }
omtalk-store = { version = "0.1.0", path = "../store" }
omtalk-xmpp = { version = "0.1.0", path = "../xmpp" }
ratatui = "0.30.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
toml = "1"
unicode-width = "0.2.2"
xmpp-parsers = "0.23.0"

[features]
# Plaintext connections to the local test server.
insecure-tcp = ["omtalk-xmpp/insecure-tcp"]
