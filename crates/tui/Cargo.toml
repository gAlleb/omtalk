[package]
name = "omtalk"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
omemo = { version = "0.1.2", path = "../omemo" }
omtalk-media = { version = "0.1.2", path = "../media" }
omtalk-omemo = { version = "0.1.2", path = "../omemo-client" }
omtalk-store = { version = "0.1.2", path = "../store" }
omtalk-xmpp = { version = "0.1.2", path = "../xmpp" }
ratatui = "0.30.2"
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process"] }
toml = "1"
toml_edit = "0.23"
unicode-width = "0.2.2"
xmpp-parsers = "0.23.0"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Plaintext connections to the local test server.
insecure-tcp = ["omtalk-xmpp/insecure-tcp"]
