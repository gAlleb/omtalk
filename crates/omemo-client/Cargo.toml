[package]
name = "omtalk-omemo"
version = "0.1.9"
edition.workspace = true
license.workspace = true

[dependencies]
futures = "0.3.34"
omemo = { version = "0.1.9", path = "../omemo" }
omemo-xml = { version = "0.1.9", path = "../omemo-xml" }
omtalk-xmpp = { version = "0.1.9", path = "../xmpp" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["sync"] }
xmpp-parsers = "0.23.0"

[dev-dependencies]
omemo-xml = { path = "../omemo-xml" }
omtalk-testkit = { path = "../testkit" }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time"] }
xmpp-parsers = "0.23.0"

[dev-dependencies.omtalk-xmpp]
path = "../xmpp"
features = ["insecure-tcp"]
