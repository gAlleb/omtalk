[package]
name = "omtalk-media"
version = "0.1.5"
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.11.1"
bytes = "1.12.1"
futures-util = "0.3.34"
getrandom = "0.4"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util"] }

[dev-dependencies]
omtalk-xmpp = { path = "../xmpp", features = ["insecure-tcp"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
