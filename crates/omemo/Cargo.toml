[package]
name = "omemo"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.3"
aes-gcm = "0.11.1"
cbc = { version = "0.2.1", features = ["alloc"] }
curve25519-dalek = "5.0.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
base64 = "0.23.1"
serde_json = "1.0.154"
