    "Paul Fariello <paul@fariello.eu>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Asynchronous XMPP for Rust with tokio"
homepage = "https://gitlab.com/xmpp-rs/xmpp-rs"
documentation = "https://docs.rs/tokio-xmpp"
readme = "README.md"
keywords = [
    "xmpp",
