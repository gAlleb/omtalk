[dependencies.bytes]
version = "1"

[dependencies.futures]
version = "0.3"

[dependencies.hickory-resolver]
version = "0.26"
optional = true

[dependencies.idna]
version = "1.0"
optional = true

[dependencies.ktls]
version = "6"
optional = true

[dependencies.log]
version = "0.4"

[dependencies.native-tls]
version = "0.2"
optional = true

[dependencies.pin-project-lite]
version = "0.2"

[dependencies.rand]
version = "0.10"

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

[dependencies.rxml]
version = "0.14.0"
features = [
    "compact_str",
    "tokio",
]

[dependencies.sasl]
version = "0.5"

[dependencies.syntect]
version = "5"
optional = true

[dependencies.thiserror]
version = "2.0"

[dependencies.tokio]
version = "1"
features = [
    "net",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
]

[dependencies.tokio-native-tls]
version = "0.3"
optional = true

[dependencies.tokio-rustls]
version = "0.26"
features = [
    "logging",
    "tls12",
]
optional = true
default-features = false

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]

[dependencies.webpki-roots]
version = "1"
optional = true

[dependencies.xmpp-parsers]
version = "0.23"
features = ["log"]

[dependencies.xso]
version = "0.4"

[dev-dependencies.env_logger]
version = "0.11"
features = [
    "auto-color",
    "humantime",
]
default-features = false

[dev-dependencies.tokio]
version = "1"
features = [
    "signal",
    "test-util",
]

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(xmpprs_doc_build)"]
