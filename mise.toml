[tools]
rust = "1.99.1"
uv = "0.13.4"
# Only for building for other machines (`mise run build-arm`): zig is the C compiler and
# linker for the C parts (ring, SQLite), so no cross toolchain is installed system-wide.
zig = "0.15.2"
"github:rust-cross/cargo-zigbuild" = "0.23.4"

[tasks.setup]
description = "Подтянуть эталон python-omemo для тестов-сверки"
run = "uv sync --project tests/oracle --frozen"

[tasks.prosody]
description = "Поднять тестовый Prosody (127.0.0.1:15222, с пустыми данными) и дождаться готовности"
# Ready only once the accounts are registered and Prosody listens: tests that start
# earlier fail on "no answer in time".
run = """
docker compose -f tests/prosody/compose.yml down -v
docker compose -f tests/prosody/compose.yml up -d
timeout 120 sh -c 'until docker logs omtalk-test-prosody 2>&1 | grep -q "Activated service .c2s. on"; do sleep 0.5; done'
"""

[tasks.test]
description = "Все тесты: сверка с python-omemo и интеграция с Prosody"
depends = ["setup", "prosody"]
run = "cargo test --workspace"

[tasks.build-arm]
description = "Собрать omtalk для 64-битного ARM (Raspberry Pi 4/5 и т.п.): один статический файл"
run = "rustup target add aarch64-unknown-linux-musl && cargo zigbuild --release -p omtalk --target aarch64-unknown-linux-musl && ls -l target/aarch64-unknown-linux-musl/release/omtalk"

[tasks.dist]
description = "Собрать omtalk для раздачи: статические файлы для x86_64 и aarch64 в dist/"
run = """
rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
cargo zigbuild --release -p omtalk --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
mkdir -p dist
cp --remove-destination target/x86_64-unknown-linux-musl/release/omtalk dist/omtalk-x86_64
cp --remove-destination target/aarch64-unknown-linux-musl/release/omtalk dist/omtalk-aarch64
ls -l dist
"""
