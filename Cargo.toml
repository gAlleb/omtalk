[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

# One small file to copy: no debug symbols, whole-program optimisation, tuned for size
# (a chat client is never CPU-bound). Panics still unwind, so one failed task does not
# take the program down.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

# tokio-xmpp 6.0.0 with early own-account IQ tracking and lost wakeups fixed (vendor/tokio-xmpp, marked "omtalk:"): its
# receiving half returned Pending without a wakeup whenever a send held the stream's
# lock, so an answer could sit unread until its request timed out.
[patch.crates-io]
tokio-xmpp = { path = "vendor/tokio-xmpp" }
